services:
  - type: web
    name: coffee-daas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python load_data.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
